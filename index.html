  <!-- Base styles -->
  <style>
    :root {
      --bg-page: linear-gradient(to bottom, #f4f7f1, #e8f5e9);
      --bg-card: #ffffff;

      --accent-main: #1b5e20;

      --text-main: #163020;

      --radius-lg: 16px;
      --radius-xl: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      color: var(--text-main);
      background: var(--bg-page);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background video */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(1px) brightness(0.8);
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        to bottom right,
        rgba(255, 255, 255, 0.85),
        rgba(232, 245, 233, 0.9)
      );
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 16px 32px;
    }

    }

    .top-logo-center,

      align-items: center;
      gap: 10px;
